[workspace]
members = [
    "crates/agent-audit-cli",
    "crates/agent-audit-core",
    "crates/agent-audit-rules",
    "crates/agent-audit-hosts",
    "crates/agent-audit-report",
    "crates/agent-audit-security",
    "crates/agent-audit-test",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
pulldown-cmark = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
