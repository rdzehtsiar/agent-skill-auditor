# SPDX-License-Identifier: Apache-2.0
name: Agent Skill Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit agent skills
        uses: ./
        with:
          path: .
          profiles: |
            agent-skills-spec
            codex
            generic
          fail-on: |
            high
            critical
