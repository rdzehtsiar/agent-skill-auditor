# SPDX-License-Identifier: Apache-2.0
name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - "releases/*"

permissions:
  contents: read

jobs:
  test:
    name: Rust tests and coverage
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install

      - name: Install Rust quality components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm wrapper tests
        run: npm test --prefix npm/agent-audit

      - name: Run representative summary scan
        run: ./target/debug/agent-audit scan fixtures/spec/phase1/representative-corpus --format text

      - name: Run representative SARIF scan
        run: ./target/debug/agent-audit scan fixtures/spec/phase1/representative-corpus --format sarif --output target/ci-agent-audit/representative.sarif

      - name: Run representative HTML scan
        run: ./target/debug/agent-audit scan fixtures/spec/phase1/representative-corpus --format html --output target/ci-agent-audit/representative.html

      - name: Run passing fail-on scan
        run: ./target/debug/agent-audit scan fixtures/compatibility/valid/spec-basic --profile agent-skills-spec --profile generic --fail-on high --fail-on critical

      - name: Upload representative scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: representative-agent-audit-reports
          path: target/ci-agent-audit
          if-no-files-found: error

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --locked --lcov --remap-path-prefix --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-lcov
          path: lcov.info
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./lcov.info
          flags: rust
          name: rust-coverage
          disable_search: true
          fail_ci_if_error: true
          plugins: noop
          verbose: true
